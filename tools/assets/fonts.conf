<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Meiryo / Consolas が無い環境で、日本語字形（JP）のNotoに置き換える。
       これを入れないと簡体字（SC）の字形が選ばれ、「直」などが中国語の形になる。 -->
  <match target="pattern">
    <test name="family"><string>Meiryo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <!-- 日本語のときは必ずJP字形を先に -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
</fontconfig>
